global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]

  - job_name: pipeline-workers
    static_configs:
      - targets:
          - "ingest-worker:9101"
          - "coordinator:9101"
          - "aggregator:9101"
          - "mock-cut-worker:9101"
          - "mock-tracking-worker:9101"

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: dcgm
    static_configs:
      - targets: ["dcgm-exporter:9400"]
