name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Pull Git LFS files
        run: git lfs pull

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt

      - name: Install dependencies
        run: python -m pip install -r backend/requirements/dev.txt

      - name: Run Ruff
        run: python -m ruff check --config backend/pyproject.toml backend/app backend/tests participant_3_tracking participant_4_cut_detection

      - name: Run Black
        run: python -m black --check --config backend/pyproject.toml backend/app backend/tests participant_3_tracking participant_4_cut_detection

      - name: Run tests
        run: python -m pytest -c backend/pyproject.toml backend/tests

      - name: Compile Python sources
        run: python -m compileall -q backend/app backend/tests participant_3_tracking participant_4_cut_detection

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Validate ML Compose configuration
        run: docker compose -f compose.yaml -f compose.ml.example.yaml config --quiet

  backend-image:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/docker/Dockerfile.backend
          push: false
          tags: cv-video-analysis-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
