name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - run: python -m pip install -r backend/requirements/dev.txt
      - run: python -m ruff check --config backend/pyproject.toml backend/app backend/tests participant_3_tracking participant_4_cut_detection
      - run: python -m black --check --config backend/pyproject.toml backend/app backend/tests participant_3_tracking participant_4_cut_detection
      - run: python -m pytest -c backend/pyproject.toml backend/tests
      - run: python -m compileall -q backend/app backend/tests participant_3_tracking participant_4_cut_detection
      - run: docker compose config --quiet
      - run: docker compose -f compose.yaml -f compose.ml.example.yaml config --quiet

  backend-image:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/docker/Dockerfile.backend
          push: false
          tags: cv-video-analysis-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
